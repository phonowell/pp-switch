[package]
name = "pp-switch"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Pure Provider: switch only API base URLs and keys"
repository = "https://github.com/phonowell/pp-switch"

[dependencies]
base64 = "0.22"
dirs = "6"
fltk = { version = "=1.5.23", features = ["no-images", "no-pango", "single-threaded"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
toml_edit = "0.23"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[example]]
name = "ui_smoke"
path = "examples/ui_smoke.rs"
