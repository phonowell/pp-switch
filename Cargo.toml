[package]
name = "pp-switch"
version = "0.0.5"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Pure Provider Switch: switch API connections with optional models"
repository = "https://github.com/phonowell/pp-switch"

[dependencies]
base64 = "0.22"
dirs = "6"
fltk = { version = "=1.5.23", features = ["no-images", "no-pango", "single-threaded", "static-msvcrt"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
toml_edit = "0.23"
yaml-edit = "=0.3.2"
url = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
semver = "1"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Threading", "Win32_Globalization", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[example]]
name = "ui_smoke"
path = "examples/ui_smoke.rs"
