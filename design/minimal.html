<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pp-switch · 极简界面预览</title>
  <style>
    :root { color-scheme: light; --surface: #f7f8fa; --ink: #282d38; --muted: #616a79; --line: #e4e7ec; --blue: #365dd8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 32px 16px; background: #eceef2; color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .app { width: 440px; max-width: 100%; background: var(--surface); border: 1px solid #ffffffb3; border-radius: 18px; box-shadow: none; padding: 22px 24px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; position: relative; margin-bottom: 24px; }
    h1 { font-size: 15px; letter-spacing: -.35px; font-weight: 650; margin: 0; }
    .icon-button { width: 30px; height: 30px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
    .icon-button:hover { background: #e9ecf1; color: var(--ink); }
    svg { width: 17px; height: 17px; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .clients { display: flex; gap: 3px; padding: 4px; background: #e9ecf1; border-radius: 10px; box-shadow: none; }
    .client { flex: 1; border: 0; padding: 7px 3px; color: #606a79; background: transparent; border-radius: 7px; white-space: nowrap; font-size: 12px; font-weight: 550; }
    .client[aria-pressed="true"] { background: #fafbfc; color: var(--ink); box-shadow: none; }
    .list-heading { margin: 27px 0 11px; display: flex; align-items: center; justify-content: space-between; }
    .list-heading h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0; }
    .quiet { border: 0; background: transparent; padding: 3px 0; font-size: 12px; color: var(--muted); }
    .quiet:hover { color: var(--blue); }
    .providers { border: 0; padding: 0; margin: 0; min-height: 210px; }
    .row { position: relative; display: flex; align-items: center; border-radius: 9px; margin: 3px 0; border: 1px solid transparent; }
    .row:has(input:checked) { background: #edf1fb; border-color: #dbe3f5; }
    .provider { display: flex; gap: 12px; flex: 1; min-width: 0; align-items: center; padding: 14px 11px; cursor: pointer; }
    .provider input { appearance: none; width: 15px; height: 15px; flex-shrink: 0; margin: 0; border: 1.5px solid #b7beca; border-radius: 50%; background: transparent; }
    .provider input:checked { border: 4.5px solid var(--blue); background: #fff; }
    .provider-info { min-width: 0; display: grid; gap: 3px; }
    .provider-name { font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .provider-url { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-end { display: flex; align-items: center; gap: 4px; padding-right: 8px; flex-shrink: 0; }
    .active-label { color: #39795f; font-size: 10px; white-space: nowrap; }
    .edit { opacity: 1; }
    .row:hover .edit, .row:focus-within .edit, .row:has(input:checked) .edit { opacity: 1; }
    .edit svg { width: 14px; height: 14px; }
    .empty { color: var(--muted); padding: 50px 10px; text-align: center; font-size: 13px; }
    .status { color: var(--muted); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
    .primary { border: 1px solid #3054c9; background: var(--blue); color: #fff; border-radius: 8px; padding: 9px 27px; font-size: 13px; font-weight: 550; box-shadow: none; white-space: nowrap; }
    .primary:hover:not(:disabled) { background: #2e53c8; }
    .primary:active:not(:disabled) { background: #2e53c8; box-shadow: none; }
    .primary:disabled { border-color: var(--line); background: #e9ecf1; color: #747d8b; box-shadow: none; }
    dialog { width: 386px; max-width: calc(100% - 32px); max-height: calc(100svh - 32px); overflow: auto; border: 1px solid #fff; border-radius: 14px; padding: 24px; color: var(--ink); background: var(--surface); box-shadow: none; }
    dialog::backdrop { background: #232e4433; }
    .dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
    .dialog-heading h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .field { display: grid; gap: 7px; margin: 15px 0; font-size: 12px; color: var(--muted); }
    .field input, .field textarea { color: var(--ink); width: 100%; min-width: 0; border: 1px solid #dce1e9; border-radius: 7px; background: #f0f2f6; box-shadow: none; padding: 10px 11px; font-size: 13px; }
    .field textarea { resize: vertical; min-height: 98px; }
    .form-actions { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 24px; }
    .form-actions .danger { margin-right: auto; color: #ac4040; }
    .secondary { border: 1px solid var(--line); border-radius: 7px; padding: 8px 14px; background: transparent; font-size: 13px; }
    .secondary:hover { background: #edf0f5; }
    .dialog-copy { color: var(--muted); font-size: 13px; margin: 8px 0; }
    .error { color: #ac4040; font-size: 12px; margin: 10px 0 0; }
    @media (max-width: 480px) { body { padding: 16px; } .app { padding: 18px; } .provider { gap: 10px; } .active-label { font-size: 9px; } }

    :root{color-scheme:light dark;--selected:#edf1fb;--hover:#e9ecf1;--field:#f0f2f6;--active:#39795f}
    .app{height:502px;padding:24px;border:0;border-radius:0}
    header{height:38px;gap:12px;margin:0}
    .clients{width:348px;height:38px;padding:3px;border-radius:7px;background:var(--hover);flex-shrink:0}
    .client{padding:0}.client[aria-pressed="true"]{background:var(--surface)}
    .icon-button{width:30px;height:30px}.icon-button:disabled{opacity:.65}.icon-button:hover{background:transparent}
    #settings{width:32px;height:32px}svg{width:18px;height:18px;stroke-width:2}
    .list-heading{height:28px;margin:22px 0 12px}.quiet{display:flex;align-items:center;gap:8px;padding:0 10px}
    .quiet svg{width:16px;height:16px}.providers{height:354px;overflow:auto;scrollbar-width:thin}
    .row{height:69px;margin:0 0 5px;border-radius:8px}.row.chosen{background:var(--selected);border-color:var(--line)}
    .provider{border:0;background:transparent;text-align:left;height:100%;color:var(--muted)}.provider svg{width:16px;height:16px;flex-shrink:0}
    .row.chosen .provider svg{color:var(--blue)}.row-end{gap:6px;padding-right:8px}.active-label{color:var(--active);margin-right:2px}
    .settings-heading{height:32px;display:flex;align-items:center;gap:12px}.settings-heading #back{width:88px;height:32px}
    .language-setting{display:flex;align-items:center;justify-content:space-between;margin-top:28px;height:36px;font-size:12px;color:var(--muted)}
    #language{width:220px;height:36px;border:0;border-radius:7px;padding:0 12px;background:var(--field);color:var(--ink)}
    .update{width:392px;height:36px;margin-top:36px}.status{margin-top:16px}
    .field input{background:var(--field);color:var(--ink);border-color:var(--line)}
    @media(prefers-color-scheme:dark){:root{--surface:#1e2026;--ink:#ebeef5;--muted:#a9b1c0;--line:#445984;--blue:#4b6ee0;--selected:#283452;--hover:#2e323c;--field:#272b34;--active:#78cca6}body{background:var(--field)}.client{color:var(--muted)}dialog{border-color:var(--line)}}
  </style>
</head>
<body>
  <main class="app" aria-label="pp-switch">
    <section id="main-page">
    <header>
    <nav class="clients" aria-label="Clients">
      <button class="client" data-client="claude" aria-pressed="true">Claude Code</button>
      <button class="client" data-client="codex" aria-pressed="false">Codex</button>
      <button class="client" data-client="gemini" aria-pressed="false">Gemini CLI</button>
    </nav><button class="icon-button" id="settings" aria-label="Settings"><svg
  xmlns="http://www.w3.org/2000/svg"

  height="24"

>

  <circle cx="12" cy="12" r="3" />
</svg>
</button></header>
    <div class="list-heading"><h2 id="providers-heading" data-text="providers">服务商</h2><button class="quiet" id="add"><svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M5 12h14" />
  <path d="M12 5v14" />
</svg>
<span data-text="add">添加</span></button></div>
    <fieldset class="providers" id="providers" aria-labelledby="providers-heading"></fieldset>
    </section>
    <section id="settings-page" hidden>
      <div class="settings-heading"><button class="quiet" id="back"><svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="m12 19-7-7 7-7" />
  <path d="M19 12H5" />
</svg>
<span data-text="back"></span></button><h1 data-text="settings"></h1></div>
      <label class="language-setting"><span data-text="language"></span><select id="language"><option value="zh">简体中文</option><option value="en">English</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option></select></label>
      <button class="secondary update" id="update-open" data-text="updates"></button>
      <p class="status" id="update-status"></p>
    </section>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="provider-form">
      <div class="dialog-heading"><h2 id="editor-title"></h2></div>
      <label class="field"><span data-text="name">名称</span><input id="name" required maxlength="80" autocomplete="off"></label>
      <label class="field"><span>Base URL</span><input id="url" type="url" required placeholder="https://api.example.com" autocomplete="off"></label>
      <label class="field"><span>API Key</span><input id="key" type="password" required autocomplete="off" spellcheck="false"></label>
      <p class="error" id="form-error" role="alert" hidden></p>
      <div class="form-actions"><button type="button" class="quiet danger" id="delete" data-text="delete">删除</button><button type="button" class="secondary" data-close="editor" data-text="cancel">取消</button><button class="primary" type="submit" data-text="save">保存</button></div>
    </form>
  </dialog>
  <dialog id="delete-confirm" aria-labelledby="delete-title">
    <h2 id="delete-title" style="font-size:16px;margin:0" data-text="deleteTitle">删除这个服务商？</h2>
    <p class="dialog-copy" data-text="deleteCopy">只移除保存的记录，客户端配置不变。</p>
    <div class="form-actions"><button class="secondary" data-close="delete-confirm" data-text="cancel">取消</button><button class="primary" id="delete-confirmed" data-text="delete">删除</button></div>
  </dialog>

  <script>
    // Standalone design preview: sample data only, no network, storage or client-file access.
    const icons = {"settings": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915\" />\n  <circle cx=\"12\" cy=\"12\" r=\"3\" />\n</svg>\n", "pencil": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\" />\n  <path d=\"m15 5 4 4\" />\n</svg>\n", "arrow-right-left": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"m16 3 4 4-4 4\" />\n  <path d=\"M20 7H4\" />\n  <path d=\"m8 21-4-4 4-4\" />\n  <path d=\"M4 17h16\" />\n</svg>\n", "arrow-left": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"m12 19-7-7 7-7\" />\n  <path d=\"M19 12H5\" />\n</svg>\n", "plus": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <path d=\"M5 12h14\" />\n  <path d=\"M12 5v14\" />\n</svg>\n", "circle": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <circle cx=\"12\" cy=\"12\" r=\"10\" />\n</svg>\n", "circle-dot": "<svg\n  xmlns=\"http://www.w3.org/2000/svg\"\n  width=\"24\"\n  height=\"24\"\n  viewBox=\"0 0 24 24\"\n  fill=\"none\"\n  stroke=\"currentColor\"\n  stroke-width=\"2\"\n  stroke-linecap=\"round\"\n  stroke-linejoin=\"round\"\n>\n  <circle cx=\"12\" cy=\"12\" r=\"1\" />\n  <circle cx=\"12\" cy=\"12\" r=\"10\" />\n</svg>\n"};
    const $ = id => document.getElementById(id);
    const text = {
      zh: { providers: '服务商', add: '＋ 添加', switch: '切换', clients: '客户端', active: '使用中', edit: '编辑', editTitle: '编辑服务商', addTitle: '添加服务商', updates: '检查更新', language: '语言', name: '名称', delete: '删除', cancel: '取消', save: '保存', close: '关闭', empty: '还没有服务商', updateDemo: '这是界面预览，不会联网检查或安装更新。', invalid: '请填写名称、HTTP(S) 地址和 API Key。', deleteTitle: '删除这个服务商？', deleteCopy: '只移除保存的记录，客户端配置不变。', daily: '日常', backup: '备用', local: '本地' },
      en: { providers: 'Providers', add: '＋ Add', switch: 'Switch', clients: 'Clients', active: 'In use', edit: 'Edit', editTitle: 'Edit provider', addTitle: 'Add provider', updates: 'Check for updates', language: 'Language', name: 'Name', delete: 'Delete', cancel: 'Cancel', save: 'Save', close: 'Close', empty: 'No providers yet', updateDemo: 'This UI preview does not check for or install updates.', invalid: 'Enter a name, HTTP(S) URL and API key.', deleteTitle: 'Delete this provider?', deleteCopy: 'Only the saved entry is removed. Client configuration stays as it is.', daily: 'Everyday', backup: 'Backup', local: 'Local' },
      'zh-TW': { providers: '供應商', add: '＋ 新增', switch: '切換', clients: '用戶端', active: '使用中', edit: '編輯', editTitle: '編輯供應商', addTitle: '新增供應商', updates: '檢查更新', language: '語言', name: '名稱', delete: '刪除', cancel: '取消', save: '儲存', close: '關閉', empty: '尚無供應商', updateDemo: '這是介面預覽，不會連線檢查或安裝更新。', invalid: '請填寫名稱、HTTP(S) 網址和 API Key。', deleteTitle: '刪除這個供應商？', deleteCopy: '只移除儲存的記錄，用戶端設定不變。', daily: '日常', backup: '備用', local: '本機' },
      ja: { providers: 'プロバイダー', add: '＋ 追加', switch: '切り替え', clients: 'クライアント', active: '使用中', edit: '編集', editTitle: 'プロバイダーを編集', addTitle: 'プロバイダーを追加', updates: '更新を確認', language: '言語', name: '名前', delete: '削除', cancel: 'キャンセル', save: '保存', close: '閉じる', empty: 'プロバイダーはありません', updateDemo: 'UI プレビューでは更新の確認やインストールを行いません。', invalid: '名前、HTTP(S) URL、API キーを入力してください。', deleteTitle: 'このプロバイダーを削除しますか？', deleteCopy: '保存した項目だけを削除します。クライアント設定は変わりません。', daily: '普段用', backup: '予備', local: 'ローカル' }
    };
    for (const [locale, labels] of Object.entries(text)) {
      labels.settings = {zh:'设置',en:'Settings','zh-TW':'設定',ja:'設定'}[locale];
      labels.back = {zh:'返回',en:'Back','zh-TW':'返回',ja:'戻る'}[locale];
      labels.add = labels.add.replace(/[＋+]/g,'').trim();
    }
    let locale = 'zh', client = 'claude', editing = null, announcement = null;
    let nextId = 10;
    const t = key => text[locale][key];
    const data = {
      claude: [{ id: 1, label: 'daily', url: 'https://api.example.com', key: 'demo-key-only' }, { id: 2, label: 'backup', url: 'https://backup.example.com', key: 'demo-key-only' }, { id: 3, label: 'local', url: 'http://localhost:8080', key: 'demo-key-only' }],
      codex: [{ id: 4, label: 'daily', url: 'https://api.example.com/v1', key: 'demo-key-only' }, { id: 5, label: 'backup', url: 'https://backup.example.com/v1', key: 'demo-key-only' }],
      gemini: [{ id: 6, label: 'daily', url: 'https://gemini.example.com', key: 'demo-key-only' }]
    };
    const selected = { claude: 2, codex: 4, gemini: 6 };
    // Keep the applied snapshot separate: editing or deleting a saved entry does not apply it.
    const applied = Object.fromEntries(Object.entries(data).map(([app, rows]) => [app, { ...rows[0] }]));
    const displayName = row => row.name || t(row.label);
    const matches = row => applied[client] && row.url === applied[client].url && row.key === applied[client].key;
    function render() {
      document.documentElement.lang = { zh: 'zh-CN', 'zh-TW': 'zh-TW', en: 'en', ja: 'ja' }[locale];
      document.querySelectorAll('[data-text]').forEach(el => el.textContent = t(el.dataset.text));
      $('settings').setAttribute('aria-label', t('settings'));
      document.querySelector('.clients').setAttribute('aria-label', t('clients'));
      document.querySelectorAll('.client').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.client === client)));
      document.querySelectorAll('[data-close]').forEach(el => { if (el.classList.contains('icon-button')) el.setAttribute('aria-label', t('close')); });
      $('editor-title').textContent = t(editing ? 'editTitle' : 'addTitle');
      const focusedId = document.activeElement?.id;
      const focusedEdit = document.activeElement?.dataset.edit;
      $('providers').replaceChildren();
      for (const row of data[client]) {
        const item = document.createElement('div'); item.className = 'row' + (selected[client] === row.id ? ' chosen' : '');
        const label = document.createElement('button'); label.className = 'provider'; label.id = 'provider-' + row.id;
        label.innerHTML = icons[selected[client] === row.id ? 'circle-dot' : 'circle'];
        label.addEventListener('click', () => { selected[client] = row.id; announcement = null; render(); });
        const info = document.createElement('span'); info.className = 'provider-info';
        const name = document.createElement('span'); name.className = 'provider-name'; name.textContent = displayName(row);
        const url = document.createElement('span'); url.className = 'provider-url'; url.textContent = row.url;
        info.append(name, url); label.append(info);
        const end = document.createElement('span'); end.className = 'row-end';
        if (matches(row)) { const active = document.createElement('span'); active.className = 'active-label'; active.textContent = t('active'); end.append(active); }
        const edit = document.createElement('button'); edit.className = 'icon-button edit'; edit.dataset.edit = row.id; edit.setAttribute('aria-label', t('edit') + ' ' + displayName(row));
        edit.innerHTML = icons.pencil;
        edit.addEventListener('click', () => openEditor(row)); end.append(edit);
        const change = document.createElement('button'); change.className = 'icon-button'; change.setAttribute('aria-label',t('switch'));
        change.innerHTML = icons['arrow-right-left']; change.disabled = matches(row);
        change.addEventListener('click', () => { applied[client] = {...row}; selected[client] = row.id; render(); });
        end.append(change); item.append(label, end); $('providers').append(item);
      }
      if (!data[client].length) { const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = t('empty'); $('providers').append(empty); }
      if (focusedId?.startsWith('provider-')) $(focusedId)?.focus();
      else if (focusedEdit) document.querySelector('[data-edit="' + focusedEdit + '"]')?.focus();
    }
    function openEditor(row = null) {
      editing = row?.id || null; $('delete').hidden = !editing;
      $('editor-title').textContent = t(editing ? 'editTitle' : 'addTitle');
      $('name').value = row ? displayName(row) : ''; $('url').value = row?.url || ''; $('key').value = row?.key || '';
      $('form-error').hidden = true; $('editor').showModal(); $('name').focus();
    }
    $('settings').addEventListener('click', () => { $('main-page').hidden=true; $('settings-page').hidden=false; $('back').focus(); });
    $('back').addEventListener('click', () => { $('settings-page').hidden=true; $('main-page').hidden=false; $('settings').focus(); });
    $('language').addEventListener('change', event => { locale = event.target.value; render(); });
    document.querySelectorAll('.client').forEach(el => el.addEventListener('click', () => { client = el.dataset.client; announcement = null; render(); }));
    $('add').addEventListener('click', () => openEditor());
    document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => $(el.dataset.close).close()));
    $('provider-form').addEventListener('submit', event => {
      event.preventDefault(); const name = $('name').value.trim(), url = $('url').value.trim(), key = $('key').value.trim();
      let address; try { address = new URL(url); } catch { /* show validation below */ }
      if (!name || !key || !address || !['http:', 'https:'].includes(address.protocol) || address.username || address.password) { $('form-error').textContent = t('invalid'); $('form-error').hidden = false; return; }
      const row = { id: editing || nextId++, name, url, key };
      if (editing) data[client] = data[client].map(p => p.id === editing ? row : p); else data[client].push(row);
      selected[client] = row.id; announcement = null; $('editor').close(); render();
    });
    $('delete').addEventListener('click', () => $('delete-confirm').showModal());
    $('delete-confirmed').addEventListener('click', () => { data[client] = data[client].filter(p => p.id !== editing); if (selected[client] === editing) selected[client] = data[client][0]?.id; announcement = null; $('delete-confirm').close(); $('editor').close(); render(); });
    $('update-open').addEventListener('click', () => { $('update-status').textContent = t('updateDemo'); });
    render();
  </script>
</body>
</html>
