name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate release tag
        shell: bash
        run: python scripts/release.py --check-tag "${GITHUB_REF_NAME}" --event "${GITHUB_REF_TYPE}"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libfontconfig1-dev fonts-noto-cjk xvfb
      - name: Package version
        shell: bash
        run: python -c 'import os; v=next(l.split(chr(34))[1] for l in open("Cargo.toml") if l.startswith("version =")); open(os.environ["GITHUB_ENV"],"a").write("PP_VERSION="+v+"\n")'
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Behavior tests
        run: cargo test --locked
      - name: Lucide SVG/native parity
        run: |
          python -m pip install fonttools==4.60.1
          python scripts/lucide.py --check
      - name: Release automation tests
        run: python -m unittest discover -s scripts -p '*_test.py'
      - name: Release application and measurement harness
        run: cargo build --locked --release --target ${{ matrix.target }} --bins --examples
      - name: Package and enforce installed-size budget
        run: python scripts/package.py ${{ matrix.target }}
      - name: GUI smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a python scripts/gui_smoke.py target/${{ matrix.target }}/release/examples/ui_smoke target/gui.ppm
      - name: GUI smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python scripts/gui_smoke.py target/${{ matrix.target }}/release/examples/ui_smoke target/gui.ppm
      - name: Native Provider link delivery (macOS)
        if: runner.os == 'macOS'
        run: python scripts/protocol_smoke.py target/${{ matrix.target }}/release/examples/protocol_smoke target/native-links
      - name: Native mouse and keyboard acceptance (macOS)
        if: runner.os == 'macOS'
        run: python scripts/gui_smoke.py --timeout 180 target/${{ matrix.target }}/release/examples/input_smoke target/input-smoke
      - name: Rendered UI regression checks (macOS)
        if: runner.os == 'macOS'
        run: python scripts/visual_check.py target/input-smoke
      - name: Live appearance and light/dark styles (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/gui_smoke.py --timeout 90 target/${{ matrix.target }}/release/examples/input_smoke target/theme-smoke --themes-only
          python scripts/visual_check.py target/theme-smoke/light
          python scripts/visual_check.py target/theme-smoke/dark
      - name: GUI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/gui_smoke.py target/${{ matrix.target }}/release/examples/ui_smoke.exe target/gui.ppm
      - name: Update helper / installation / restart (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a target/${{ matrix.target }}/release/examples/update_smoke
          target/${{ matrix.target }}/release/examples/update_smoke --archive target/package/pp-switch-v${{ env.PP_VERSION }}-${{ matrix.target }}.tar.gz
      - name: Update helper / installation / restart (macOS)
        if: runner.os == 'macOS'
        run: |
          target/${{ matrix.target }}/release/examples/update_smoke
          target/${{ matrix.target }}/release/examples/update_smoke --archive target/package/pp-switch-v${{ env.PP_VERSION }}-${{ matrix.target }}.zip
      - name: Update helper / installation / restart (Windows)
        if: runner.os == 'Windows'
        run: |
          target/${{ matrix.target }}/release/examples/update_smoke.exe
          target/${{ matrix.target }}/release/examples/update_smoke.exe --archive target/package/pp-switch-v${{ env.PP_VERSION }}-${{ matrix.target }}.zip
      - name: Memory and startup budget (Linux)
        continue-on-error: true
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui --output target/metrics.json --enforce
      - name: Memory and startup budget (macOS)
        continue-on-error: true
        if: runner.os == 'macOS'
        run: python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui --output target/metrics.json --enforce
      - name: Memory and startup budget (Windows)
        continue-on-error: true
        if: runner.os == 'Windows'
        run: |
          python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui.exe --output target/metrics.json --enforce
      - name: Provider editor memory (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui --editor --output target/editor-metrics.json --enforce
      - name: Provider editor memory (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui --editor --output target/editor-metrics.json --enforce
      - name: Provider editor memory (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui.exe --editor --output target/editor-metrics.json --enforce
      - name: Verify measurement evidence
        shell: bash
        run: python scripts/release.py --check-metrics target/metrics.json target/editor-metrics.json
      - name: Upload packages and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pp-switch-${{ matrix.target }}
          path: |
            target/package/*.zip
            target/package/*.tar.gz
            target/package/*.json
            target/metrics.json
            target/editor-metrics.json
            target/gui*.ppm
            target/input-smoke/*.ppm
            target/input-smoke/*.png
            target/input-smoke/results.json
            target/theme-smoke/**
            target/native-links/**
            target/input-smoke/interaction-results.json
            target/gui-hang.txt
            target/measure-hang.txt
          if-no-files-found: ignore

  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: pp-switch-*
          path: target/native-artifacts
      - name: Assemble and verify all native packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/release.py --artifacts target/native-artifacts --output target/release-assets
      - name: Publish verified preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py --publish target/release-assets
