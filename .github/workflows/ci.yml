name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libfontconfig1-dev xvfb
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Behavior tests
        run: cargo test --locked
      - name: Release application and measurement harness
        run: cargo build --locked --release --target ${{ matrix.target }} --bins --examples
      - name: Package and enforce installed-size budget
        run: python scripts/package.py ${{ matrix.target }}
      - name: GUI smoke and metrics (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a target/${{ matrix.target }}/release/examples/ui_smoke
          xvfb-run -a python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui --output target/metrics.json --enforce
      - name: GUI smoke and metrics (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target/${{ matrix.target }}/release/examples/ui_smoke
          python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui --output target/metrics.json --enforce
      - name: GUI smoke and metrics (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & target/${{ matrix.target }}/release/examples/ui_smoke.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/measure.py target/${{ matrix.target }}/release/examples/measure_ui.exe --output target/metrics.json --enforce
      - name: Upload packages and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pp-switch-${{ matrix.target }}
          path: |
            target/package/*.zip
            target/package/*.tar.gz
            target/package/*.json
            target/metrics.json
          if-no-files-found: ignore
